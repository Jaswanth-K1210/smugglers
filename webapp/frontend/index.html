<!doctype html>
<meta charset="utf-8">
<title>Dark STS Detection</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--bg:#0f1419;--panel:#171d24;--line:#26313c;--ink:#e6edf3;--dim:#8b98a5;
        --visible:#2b8cbe;--partial:#fdae61;--unmatched:#d7191c}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;
         align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:600}
  .sub{color:var(--dim);font-size:12px}
  main{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 53px)}
  aside{border-right:1px solid var(--line);overflow-y:auto;padding:16px}
  #map{height:100%}
  .stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
  .stat b{font-variant-numeric:tabular-nums}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
  .ev{padding:9px;border:1px solid var(--line);border-radius:6px;margin:7px 0;cursor:pointer}
  .ev:hover{border-color:var(--dim)}
  .ev .t{font-size:12px;color:var(--dim)}
  .note{color:var(--dim);font-size:11.5px;margin-top:14px;padding-top:12px;
        border-top:1px solid var(--line)}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);
     margin:18px 0 6px}
  @media(max-width:760px){main{grid-template-columns:1fr;height:auto}#map{height:62vh}}
</style>
<header>
  <h1>Dark STS Detection</h1>
  <span class="sub">Sentinel-1 SAR &middot; AIS &middot; GFW comparison layers &mdash; open data only</span>
</header>
<main>
  <aside>
    <h2>Summary</h2><div id="summary"></div>
    <h2>Candidates</h2><div id="list"></div>
    <div class="note" id="note"></div>
  </aside>
  <div id="map"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLOUR = {AIS_VISIBLE:'#2b8cbe', AIS_PARTIAL:'#fdae61', AIS_UNMATCHED:'#d7191c'};
const map = L.map('map').setView([57.7, 10.6], 8);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  {attribution:'&copy; OpenStreetMap, &copy; CARTO', maxZoom:18}).addTo(map);

const fmt = v => v === null || v === undefined || v === '' ? '&mdash;' : v;

async function load() {
  const [sum, ev] = await Promise.all([
    fetch('api/summary').then(r => r.json()),
    fetch('api/events?limit=500').then(r => r.json())
  ]);

  document.getElementById('summary').innerHTML =
    `<div class="stat"><span>Total candidates</span><b>${sum.total}</b></div>` +
    Object.entries(sum.by_category).map(([k, v]) =>
      `<div class="stat"><span><i class="dot" style="background:${COLOUR[k]||'#666'}"></i>${k}</span><b>${v}</b></div>`
    ).join('');
  document.getElementById('note').textContent = sum.note;

  const bounds = [];
  document.getElementById('list').innerHTML = ev.features.map((f, i) => {
    const p = f.properties, c = f.geometry.coordinates;
    const col = COLOUR[p.category] || '#666';
    bounds.push([c[1], c[0]]);
    L.circleMarker([c[1], c[0]], {
      radius: 6 + 10 * (p.suspicion || 0), color: col,
      fillColor: col, fillOpacity: .6, weight: 2
    }).addTo(map).bindPopup(
      `<b style="color:${col}">${p.category}</b><br>${fmt(p.time)}<br>` +
      `AIS identities: ${fmt(p.n_identities)}<br>Size: ${fmt(p.size_class)}<br>` +
      `GFW encounter: ${fmt(p.gfw_encounter)}<br>Suspicion: ${(p.suspicion||0).toFixed(3)}`
    );
    return `<div class="ev" onclick="map.flyTo([${c[1]},${c[0]}],12)">
      <i class="dot" style="background:${col}"></i><b>${p.category}</b>
      &nbsp;<span class="t">${(p.suspicion||0).toFixed(2)}</span>
      <div class="t">${fmt(p.time)} &middot; ${fmt(p.size_class)} &middot; ${fmt(p.n_identities)} AIS id</div>
    </div>`;
  }).join('') || '<div class="t">No candidates in this run.</div>';

  if (bounds.length) map.fitBounds(bounds, {padding:[45,45], maxZoom:11});
}
load().catch(e => document.getElementById('list').textContent = 'Failed to load: ' + e);
</script>
